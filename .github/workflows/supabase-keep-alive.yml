name: Supabase Keep Alive
# Este workflow envia um ping para o Supabase a cada 5 dias para manter a instância ativa.
on:
  schedule:
    # Roda a cada 5 dias às 00:00 UTC
    - cron: '0 0 */5 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar Ping para o Supabase
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"